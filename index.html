function getTodayStr() { return new Date().toISOString().split('T')[0]; }
function getTimeStr() { return new Date().toTimeString().slice(0, 5); }
function getClockStr() { return new Date().toTimeString().slice(0, 8); }
function normalizeWA(phone) {
  let c = String(phone || '').replace(/[^0-9]/g, '');
  if (c.startsWith('0')) c = '62' + c.slice(1);
  if (!c.startsWith('62') && c.length > 5) c = '62' + c;
  return c;
}
function formatDateIndo(isoStr) {
  const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const d = new Date(isoStr + 'T00:00:00');
  if (isNaN(d.getTime())) return isoStr;
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function openDirectWA(phone, msg) {
  window.open(`https://wa.me/${normalizeWA(phone)}?text=${encodeURIComponent(msg)}`, '_blank');
}

async function sendRealWA(phone, recipientName, message) {
  const norm = normalizeWA(phone);
  const entry = { id: 'WA-' + Math.floor(1000 + Math.random()*9000), waktu: getTodayStr() + ' ' + getTimeStr(), tujuan: norm, penerima: recipientName, pesan: message, status: 'Mengirim...', detail: '' };
  db.waLogs.unshift(entry);
  saveState();

  const cfg = db.waConfig;
  if (cfg.sendMode === 'direct_wa') {
    entry.status = 'Dibuka di App WA';
    entry.detail = 'Membuka wa.me';
    saveState();
    openDirectWA(norm, message);
    return { ok: true, detail: 'Membuka aplikasi WhatsApp...' };
  }

  const token = (cfg.apiKey || '').trim();
  if (!token) {
    entry.status = cfg.sendMode === 'api_and_fallback' ? 'Fallback App WA' : 'Token Kosong';
    entry.detail = 'Isi API Token di pengaturan WA atau gunakan Buka Langsung App WA.';
    if (cfg.sendMode === 'api_and_fallback') openDirectWA(norm, message);
    saveState();
    return { ok: cfg.sendMode === 'api_and_fallback', detail: entry.detail };
  }

  try {
    let res;
    if (cfg.provider === 'fonnte') {
      const fd = new FormData();
      fd.append('target', norm);
      fd.append('message', message);
      fd.append('countryCode', '62');
      res = await fetch(cfg.endpoint || 'https://api.fonnte.com/send', { method: 'POST', headers: { 'Authorization': token }, body: fd });
    } else {
      res = await fetch(cfg.endpoint, {
        method: 'POST',
        headers: { 'Authorization': token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: norm, target: norm, message })
      });
    }
    const txt = await res.text();
    let j = {}; try { j = JSON.parse(txt); } catch (e) {}
    if (res.ok && j.status !== false) {
      entry.status = 'Terkirim (API)';
      entry.detail = j.detail || j.message || 'Terkirim';
      saveState();
      return { ok: true, detail: entry.detail };
    }
    throw new Error(j.reason || j.message || 'HTTP ' + res.status);
  } catch (err) {
    entry.status = cfg.sendMode === 'api_and_fallback' ? 'Fallback App WA' : 'Gagal API';
    entry.detail = err.message;
    if (cfg.sendMode === 'api_and_fallback') openDirectWA(norm, message);
    saveState();
    return { ok: cfg.sendMode === 'api_and_fallback', detail: entry.detail };
  }
}

function processScan(rawCode) {
  const code = String(rawCode || '').trim();
  if (!code) return;
  const s = db.siswa.find(x => x.nisn === code);
  const p = db.pegawai.find(x => x.pegId.toLowerCase() === code.toLowerCase());
  if (!s && !p) {
    scanFeedback = { ok: false, title: 'Tidak Terdaftar', msg: `Kode "${code}" tidak ditemukan pada Siswa maupun Guru & Tendik.` };
    render();
    return;
  }
  const today = getTodayStr(), jam = getTimeStr();
  const kode = s ? s.nisn : p.pegId;
  const nama = s ? s.nama : p.nama;
  const tipe = s ? 'Siswa' : p.kategori;
  const unit = s ? s.kelas : p.unit;
  let ex = db.absensi.find(a => a.tanggal === today && a.kode === kode);

  if (scanMode === 'masuk') {
    if (ex && ex.jamMasuk) {
      scanFeedback = { ok: false, title: 'Sudah Absen Masuk', msg: `${nama} sudah absen masuk pukul ${ex.jamMasuk} WIB.` };
      render(); return;
    }
    const klsObj = s ? db.kelasList.find(k => k.nama === s.kelas) : null;
    const jamTarget = (klsObj && klsObj.jamMasuk) ? klsObj.jamMasuk : db.school.jamMasuk;
    const [hT, mT] = jamTarget.split(':').map(Number);
    const [hN, mN] = jam.split(':').map(Number);
    const status = (hN * 60 + mN) > (hT * 60 + mT + Number(db.school.toleransiMenit || 0)) ? 'Terlambat' : 'Hadir';
    if (ex) { ex.jamMasuk = jam; ex.status = status; }
    else db.absensi.unshift({ id: 'ABS-' + Date.now(), tanggal: today, kode, nama, tipe, kelasUnit: unit, jamMasuk: jam, jamPulang: '', status });

    let waMsg = '';
    if (s) {
      waMsg = db.waConfig.tplMasuk
        .replaceAll('{nama_wali}', s.wali).replaceAll('{nama_siswa}', s.nama)
        .replaceAll('{nisn}', s.nisn).replaceAll('{kelas}', s.kelas)
        .replaceAll('{sekolah}', db.school.name).replaceAll('{tanggal}', today)
        .replaceAll('{jam}', jam).replaceAll('{status}', status);
      if (db.waConfig.autoRealtime) sendRealWA(s.waWali, `${s.wali} (Wali ${s.nama})`, waMsg);
    }
    scanFeedback = { ok: true, title: `Absen Masuk (${status})`, msg: `${nama} • ${kode} • ${jam} WIB`, waPhone: s ? s.waWali : '', waText: waMsg };
  } else {
    if (!ex || !ex.jamMasuk) {
      scanFeedback = { ok: false, title: 'Belum Absen Masuk', msg: `${nama} belum tercatat absen masuk hari ini.` };
      render(); return;
    }
    if (ex.jamPulang) {
      scanFeedback = { ok: false, title: 'Sudah Absen Pulang', msg: `${nama} sudah absen pulang pukul ${ex.jamPulang} WIB.` };
      render(); return;
    }
    ex.jamPulang = jam;
    let waMsg = '';
    if (s) {
      waMsg = db.waConfig.tplPulang
        .replaceAll('{nama_wali}', s.wali).replaceAll('{nama_siswa}', s.nama)
        .replaceAll('{nisn}', s.nisn).replaceAll('{kelas}', s.kelas)
        .replaceAll('{sekolah}', db.school.name).replaceAll('{tanggal}', today)
        .replaceAll('{jam}', jam);
      if (db.waConfig.autoRealtime) sendRealWA(s.waWali, `${s.wali} (Wali ${s.nama})`, waMsg);
    }
    scanFeedback = { ok: true, title: 'Absen Pulang Berhasil', msg: `${nama} • ${kode} • Pulang ${jam} WIB`, waPhone: s ? s.waWali : '', waText: waMsg };
  }
  saveState(); render();
}

async function startCameraScanner() {
  if (isScanningCamera || typeof Html5Qrcode === 'undefined') return;
  try {
    html5QrScanner = new Html5Qrcode('qr-reader');
    await html5QrScanner.start(
      { facingMode: 'environment' },
      { fps: 12, qrbox: { width: 280, height: 140 } },
      (decoded) => {
        const clean = String(decoded || '').trim();
        const now = Date.now();
        if (clean && (clean !== lastCode || now - lastTime > 2500)) {
          lastCode = clean; lastTime = now;
          processScan(clean);
        }
      },
      () => {}
    );
    isScanningCamera = true; render();
  } catch (e) { alert('Kamera tidak dapat diakses: ' + e.message); }
}

async function stopCameraScanner() {
  if (html5QrScanner && isScanningCamera) {
    try { await html5QrScanner.stop(); await html5QrScanner.clear(); } catch (e) {}
  }
  html5QrScanner = null; isScanningCamera = false; render();
}

function saveKelasModal(e) {
  e.preventDefault();
  const oldNama = kelasModal.editIndex >= 0 ? db.kelasList[kelasModal.editIndex].nama : '';
  const newNama = document.getElementById('m-k-nama').value.trim();
  const item = {
    id: kelasModal.id || ('K' + (db.kelasList.length + 1)),
    nama: newNama,
    waliKelas: document.getElementById('m-k-wali').value.trim(),
    waWaliKelas: normalizeWA(document.getElementById('m-k-wa').value),
    jamMasuk: document.getElementById('m-k-masuk').value,
    jamPulang: document.getElementById('m-k-pulang').value
  };
  if (kelasModal.editIndex >= 0) {
    db.kelasList[kelasModal.editIndex] = item;
    if (oldNama && oldNama !== newNama) {
      db.siswa.forEach(s => { if (s.kelas === oldNama) s.kelas = newNama; });
    }
  } else {
    db.kelasList.push(item);
  }
  kelasModal.open = false;
  saveState(); render();
}

function exportSiswaCSV() {
  const rows = [['NISN', 'Nama Lengkap', 'Kelas', 'Wali Murid', 'No WA Wali']];
  db.siswa.forEach(s => rows.push([s.nisn, `"${s.nama}"`, `"${s.kelas}"`, `"${s.wali}"`, s.waWali]));
  const blob = new Blob([rows.map(r => r.join(',')).join('
')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Data_Siswa_MNT.csv'; a.click();
}

function importSiswaCSV(ev) {
  const f = ev.target.files && ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const lines = r.result.split(/?
/).filter(x => x.trim());
    let added = 0;
    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(',').map(c => c.replace(/^"|"$/g, '').trim());
      if (cols[0] && cols[1]) {
        db.siswa.push({ nisn: cols[0], nama: cols[1], kelas: cols[2] || (db.kelasList[0]?.nama || 'X IPA 1'), wali: cols[3] || '-', waWali: normalizeWA(cols[4] || '') });
        added++;
      }
    }
    saveState(); alert(`${added} data siswa berhasil diimpor!`); render();
  };
  r.readAsText(f);
  ev.target.value = '';
}

function renderKartuBarcode() {
  setTimeout(() => {
    if (typeof JsBarcode === 'undefined') return;
    document.querySelectorAll('.barcode-el').forEach(el => {
      try { JsBarcode(el, el.dataset.code, { format: 'CODE128', width: 1.5, height: 38, displayValue: true, fontSize: 11, margin: 2 }); } catch (e) {}
    });
  }, 50);

  return `<div class="space-y-4">
    <div class="flex items-center justify-between">
      <div><h2 class="text-2xl font-extrabold text-slate-900">Kartu Barcode</h2><p class="text-xs text-slate-500">Kartu NISN Siswa & ID Pegawai siap cetak dan scan.</p></div>
      <button onclick="window.print()" class="no-print px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-bold">🖨️ Cetak Kartu</button>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      ${db.siswa.map(s => `<div class="bg-white rounded-2xl border border-slate-200 p-4 space-y-2">
        <div class="flex justify-between items-center"><span class="text-[11px] font-extrabold text-emerald-700 uppercase">${db.school.name}</span><span class="px-2 py-0.5 rounded bg-emerald-50 text-emerald-800 text-[10px] font-bold">${s.kelas}</span></div>
        <p class="font-bold text-sm text-slate-900">${s.nama}</p>
        <p class="text-[11px] text-slate-500">Wali: ${s.wali} (+${normalizeWA(s.waWali)})</p>
        <div class="bg-slate-50 rounded-xl p-2 flex justify-center"><svg class="barcode-el" data-code="${s.nisn}"></svg></div>
      </div>`).join('')}
    </div>
  </div>`;
}

function render() {
  const app = document.getElementById('app');
  if (!app) return;

  let mainContent = '';
  if (activeNav === 'dashboard') mainContent = renderDashboard();
  else if (activeNav === 'scan') mainContent = renderScanAbsensi();
  else if (activeNav === 'datamaster') mainContent = renderDataMaster();
  else if (activeNav === 'kartu') mainContent = renderKartuBarcode();

  app.innerHTML = `<div class="min-h-screen flex flex-col md:flex-row">
    <aside class="no-print w-full md:w-64 bg-slate-900 text-slate-200 flex flex-col justify-between shrink-0">
      <div class="p-4 space-y-5">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-emerald-500 text-slate-950 font-extrabold text-sm flex items-center justify-center shadow">MA</div>
          <div>
            <h1 class="text-sm font-extrabold text-white leading-tight">${db.school.name}</h1>
            <p class="text-[11px] text-slate-400 leading-tight">${db.school.subtitle}</p>
          </div>
        </div>

        <div class="bg-slate-800/80 rounded-xl p-3 border border-slate-700/60">
          <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400">MODE PERAN AKTIF</p>
          <div class="mt-1.5 flex items-center justify-between text-xs font-bold text-white">
            <span>${db.roleLabel}</span>
            <span class="text-slate-400">▾</span>
          </div>
        </div>

        <nav class="space-y-1">
          <button onclick="stopCameraScanner(); activeNav='dashboard'; render();" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition ${activeNav === 'dashboard' ? 'bg-emerald-600 text-white shadow' : 'text-slate-300 hover:bg-slate-800'}">
            <span>▦</span><span>Dashboard</span>
          </button>
          <button onclick="activeNav='scan'; render();" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition ${activeNav === 'scan' ? 'bg-emerald-600 text-white shadow' : 'text-slate-300 hover:bg-slate-800'}">
            <span>📷</span><span>Scan Absensi</span>
          </button>
          <button onclick="stopCameraScanner(); activeNav='datamaster'; render();" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition ${activeNav === 'datamaster' ? 'bg-emerald-600 text-white shadow' : 'text-slate-300 hover:bg-slate-800'}">
            <span>🗄️</span><span>Data Master</span>
          </button>
          <button onclick="stopCameraScanner(); activeNav='kartu'; render();" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition ${activeNav === 'kartu' ? 'bg-emerald-600 text-white shadow' : 'text-slate-300 hover:bg-slate-800'}">
            <span>🪪</span><span>Kartu Barcode</span>
          </button>
        </nav>
      </div>

      <div class="p-4 border-t border-slate-800 space-y-2.5">
        <div class="flex items-center justify-between text-xs">
          <span class="flex items-center gap-1.5 text-emerald-400 font-semibold"><span class="w-2 h-2 rounded-full bg-emerald-400"></span>WA Gateway Aktif</span>
          <span id="live-clock" class="font-mono text-slate-400">${getClockStr()}</span>
        </div>
        <button onclick="resetDemoData()" class="w-full py-2 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold flex items-center justify-center gap-1.5 border border-slate-700">
          <span>↺</span><span>Reset Data Demo Awal</span>
        </button>
      </div>
    </aside>

    <main class="flex-1 p-4 md:p-7 max-w-6xl w-full mx-auto">
      ${mainContent}
    </main>
  </div>
  ${renderModals()}`;
}

render();
</script>
</body>
</html>
