function getTodayStr() { return new Date().toISOString().split('T')[0]; }
function getTimeStr() { return new Date().toTimeString().slice(0, 5); }
function normalizeWA(phone) {
  let clean = String(phone || '').replace(/[^0-9]/g, '');
  if (clean.startsWith('0')) clean = '62' + clean.slice(1);
  if (!clean.startsWith('62') && clean.length > 5) clean = '62' + clean;
  return clean;
}

function playBeep(success = true) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = success ? 'sine' : 'sawtooth';
    osc.frequency.setValueAtTime(success ? 920 : 210, ctx.currentTime);
    gain.gain.setValueAtTime(0.16, ctx.currentTime);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + (success ? 0.16 : 0.35));
    if (navigator.vibrate) navigator.vibrate(success ? 80 : [120, 60, 120]);
  } catch (e) {}
}

function formatTemplate(tpl, vars) {
  let out = tpl;
  Object.keys(vars).forEach(k => { out = out.replaceAll('{' + k + '}', vars[k] || '-'); });
  return out;
}

function openDirectWhatsApp(phone, message) {
  const norm = normalizeWA(phone);
  window.open(`https://wa.me/${norm}?text=${encodeURIComponent(message)}`, '_blank');
}

async function sendRealWhatsApp(phone, recipientName, message) {
  const norm = normalizeWA(phone);
  const now = getTodayStr() + ' ' + getTimeStr();
  const cfg = db.waConfig;
  const logEntry = {
    id: 'WA-' + Math.floor(1000 + Math.random() * 9000),
    waktu: now, tujuan: norm, penerima: recipientName, pesan: message, status: 'Mengirim...', detail: ''
  };
  db.waLogs.unshift(logEntry);
  saveState();

  if (cfg.sendMode === 'direct_wa') {
    logEntry.status = 'Dibuka di App WA';
    logEntry.detail = 'Dialihkan ke aplikasi WhatsApp';
    saveState();
    openDirectWhatsApp(norm, message);
    return { ok: true, detail: 'Membuka aplikasi WhatsApp...' };
  }

  if (!isOnline) {
    logEntry.status = 'Gagal (Offline)';
    logEntry.detail = 'Perangkat sedang offline';
    saveState();
    return { ok: false, detail: 'Perangkat offline' };
  }

  const token = (cfg.apiKey || '').trim();
  if (!token) {
    logEntry.status = 'Gagal (Token Belum Diisi)';
    logEntry.detail = 'Masukkan API Token asli atau gunakan Mode Buka Langsung App WA.';
    if (cfg.sendMode === 'api_and_fallback') {
      logEntry.status = 'Fallback ke App WA';
      openDirectWhatsApp(norm, message);
    }
    saveState();
    return { ok: false, detail: logEntry.detail };
  }

  try {
    let response;
    if (cfg.provider === 'fonnte') {
      const formData = new FormData();
      formData.append('target', norm);
      formData.append('message', message);
      formData.append('countryCode', '62');
      response = await fetch(cfg.endpoint || 'https://api.fonnte.com/send', {
        method: 'POST', headers: { 'Authorization': token }, body: formData
      });
    } else if (cfg.provider === 'wablas') {
      response = await fetch(cfg.endpoint, {
        method: 'POST',
        headers: { 'Authorization': token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: norm, message })
      });
    } else {
      response = await fetch(cfg.endpoint, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ to: norm, target: norm, sender: normalizeWA(cfg.senderPhone), message, text: message })
      });
    }
    const rawText = await response.text();
    let parsed = {};
    try { parsed = JSON.parse(rawText); } catch (e) {}
    if (response.ok && parsed.status !== false) {
      logEntry.status = 'Terkirim (API)';
      logEntry.detail = parsed.detail || parsed.message || 'Berhasil dikirim oleh gateway';
      saveState();
      return { ok: true, detail: logEntry.detail };
    }
    throw new Error(parsed.reason || parsed.message || `HTTP ${response.status}`);
  } catch (err) {
    logEntry.status = 'Gagal API';
    logEntry.detail = err.message || 'Gagal terhubung ke API';
    if (cfg.sendMode === 'api_and_fallback') {
      logEntry.status = 'Fallback App WA';
      openDirectWhatsApp(norm, message);
    }
    saveState();
    return { ok: false, detail: logEntry.detail };
  }
}

async function startRealBarcodeScanner() {
  if (isScanningCamera) return;
  if (typeof Html5Qrcode === 'undefined') {
    alert('Library pemindai barcode belum siap. Gunakan kolom input NISN/PegID atau Scan dari Foto.');
    return;
  }
  const readerEl = document.getElementById('qr-reader');
  if (!readerEl) return;

  try {
    html5QrScanner = new Html5Qrcode('qr-reader');
    const formatsToSupport = [
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.CODE_93,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.QR_CODE,
      Html5QrcodeSupportedFormats.DATA_MATRIX
    ];

    await html5QrScanner.start(
      { facingMode: 'environment' },
      {
        fps: 12,
        qrbox: function(viewfinderWidth, viewfinderHeight) {
          const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
          const boxW = Math.min(Math.floor(viewfinderWidth * 0.85), 340);
          const boxH = Math.min(Math.floor(minEdge * 0.45), 160);
          return { width: boxW, height: boxH };
        },
        formatsToSupport
      },
      (decodedText) => {
        const cleanCode = String(decodedText || '').trim();
        const now = Date.now();
        if (cleanCode && (cleanCode !== lastScannedCode || now - lastScannedTime > 2500)) {
          lastScannedCode = cleanCode;
          lastScannedTime = now;
          processScan(cleanCode);
        }
      },
      () => {}
    );
    isScanningCamera = true;
    render();
  } catch (err) {
    isScanningCamera = false;
    render();
    alert('Gagal membuka kamera: ' + (err.message || err));
  }
}

async function stopRealBarcodeScanner() {
  if (html5QrScanner && isScanningCamera) {
    try { await html5QrScanner.stop(); await html5QrScanner.clear(); } catch (e) {}
  }
  html5QrScanner = null;
  isScanningCamera = false;
  render();
}

async function scanBarcodeFromFile(event) {
  const file = event.target.files && event.target.files[0];
  if (!file || typeof Html5Qrcode === 'undefined') return;
  try {
    const tempScanner = new Html5Qrcode('qr-file-temp', false);
    const result = await tempScanner.scanFile(file, true);
    processScan(result);
  } catch (err) {
    playBeep(false);
    scanFeedback = { ok: false, title: 'Barcode Tidak Terbaca', msg: 'Gambar tidak memuat barcode/QR yang jelas.' };
    render();
  }
  event.target.value = '';
}

function processScan(rawCode, forceMode = null) {
  const code = String(rawCode || '').trim();
  if (!code) return;
  const mode = forceMode || scanMode;
  const today = getTodayStr();
  const jam = getTimeStr();

  const siswa = db.siswa.find(s => s.nisn === code || s.nama.toLowerCase() === code.toLowerCase());
  const peg = db.pegawai.find(p => p.pegId.toLowerCase() === code.toLowerCase() || p.nama.toLowerCase() === code.toLowerCase());

  if (!siswa && !peg) {
    playBeep(false);
    scanFeedback = { ok: false, title: 'Barcode / ID Tidak Terdaftar', msg: `Hasil scan "${code}" tidak cocok dengan NISN Siswa maupun PegID Guru/Tendik.` };
    render();
    return;
  }

  const targetCode = siswa ? siswa.nisn : peg.pegId;
  const targetName = siswa ? siswa.nama : peg.nama;
  const targetTipe = siswa ? 'Siswa' : 'Guru/Tendik';
  const targetUnit = siswa ? siswa.kelas : peg.unit;
  const existing = db.absensi.find(a => a.tanggal === today && a.kode === targetCode);

  if (mode === 'masuk') {
    if (existing && existing.jamMasuk) {
      playBeep(false);
      scanFeedback = { ok: false, title: 'Sudah Absen Masuk!', msg: `${targetName} sudah absen masuk hari ini pukul ${existing.jamMasuk} WIB.` };
      render();
      return;
    }
    const [hIn, mIn] = db.school.jamMasuk.split(':').map(Number);
    const [hNow, mNow] = jam.split(':').map(Number);
    const status = (hNow * 60 + mNow) > (hIn * 60 + mIn + Number(db.school.toleransiMenit || 0)) ? 'Terlambat' : 'Hadir';

    if (existing) { existing.jamMasuk = jam; existing.status = status; }
    else db.absensi.unshift({ id: 'ABS-' + Date.now(), tanggal: today, kode: targetCode, nama: targetName, tipe: targetTipe, kelasUnit: targetUnit, jamMasuk: jam, jamPulang: '', status });

    let waMsg = '';
    if (siswa) {
      waMsg = formatTemplate(db.waConfig.tplMasuk, { nama_wali: siswa.wali, nama_siswa: siswa.nama, nisn: siswa.nisn, kelas: siswa.kelas, jam, status, tanggal: today, sekolah: db.school.name });
      if (db.waConfig.autoRealtime) sendRealWhatsApp(siswa.waWali, `${siswa.wali} (Wali ${siswa.nama})`, waMsg);
    }
    playBeep(true);
    scanFeedback = { ok: true, title: `Absen Masuk Berhasil (${status})`, msg: `${targetName} • Kode: ${targetCode} • Pukul ${jam} WIB`, waPhone: siswa ? siswa.waWali : '', waText: waMsg };
  } else {
    if (!existing || !existing.jamMasuk) {
      playBeep(false);
      scanFeedback = { ok: false, title: 'Belum Absen Masuk', msg: `${targetName} belum tercatat absen masuk hari ini.` };
      render();
      return;
    }
    if (existing.jamPulang) {
      playBeep(false);
      scanFeedback = { ok: false, title: 'Sudah Absen Pulang!', msg: `${targetName} sudah absen pulang pukul ${existing.jamPulang} WIB.` };
      render();
      return;
    }
    existing.jamPulang = jam;

    let waMsg = '';
    if (siswa) {
      waMsg = formatTemplate(db.waConfig.tplPulang, { nama_wali: siswa.wali, nama_siswa: siswa.nama, nisn: siswa.nisn, kelas: siswa.kelas, jam, status: 'Pulang', tanggal: today, sekolah: db.school.name });
      if (db.waConfig.autoRealtime) sendRealWhatsApp(siswa.waWali, `${siswa.wali} (Wali ${siswa.nama})`, waMsg);
    }
    playBeep(true);
    scanFeedback = { ok: true, title: 'Absen Pulang Berhasil', msg: `${targetName} • Kode: ${targetCode} • Pulang ${jam} WIB`, waPhone: siswa ? siswa.waWali : '', waText: waMsg };
  }

  saveState();
  render();
}

function loginAs(userId, pin) {
  const u = db.users.find(x => x.id.toLowerCase() === String(userId).trim().toLowerCase() && x.pin === String(pin).trim());
  if (!u) return alert('ID Pengguna atau PIN salah!');
  currentUser = u;
  activeTab = u.role === 'piket' ? 'scan' : (u.role === 'walimurid' ? 'portal_wali' : 'dashboard');
  render();
}
function quickLogin(role) { const u = db.users.find(x => x.role === role); if (u) loginAs(u.id, u.pin); }
function logout() { stopRealBarcodeScanner(); currentUser = null; render(); }

function toggleKioskLock() {
  if (!kioskLocked) { kioskLocked = true; activeTab = 'scan'; render(); }
  else {
    const p = prompt('Masukkan PIN Kunci Kios:');
    if (p === db.school.kioskPin) { kioskLocked = false; render(); }
    else if (p !== null) alert('PIN salah!');
  }
}

function setManualStatus(kode, tipe, nama, kelasUnit, statusBaru) {
  const today = getTodayStr(); const jam = getTimeStr();
  let rec = db.absensi.find(a => a.tanggal === today && a.kode === kode);
  if (rec) { rec.status = statusBaru; if (!rec.jamMasuk && (statusBaru === 'Hadir' || statusBaru === 'Terlambat')) rec.jamMasuk = jam; }
  else db.absensi.unshift({ id: 'ABS-' + Date.now(), tanggal: today, kode, nama, tipe, kelasUnit, jamMasuk: (statusBaru === 'Hadir' || statusBaru === 'Terlambat') ? jam : '-', jamPulang: '', status: statusBaru });

  if (tipe === 'Siswa' && ['Sakit', 'Izin', 'Alpha'].includes(statusBaru)) {
    const s = db.siswa.find(x => x.nisn === kode);
    if (s) {
      const msg = formatTemplate(db.waConfig.tplStatus, { nama_wali: s.wali, nama_siswa: s.nama, nisn: s.nisn, kelas: s.kelas, jam, status: statusBaru.toUpperCase(), tanggal: today, sekolah: db.school.name });
      sendRealWhatsApp(s.waWali, `${s.wali} (Wali ${s.nama})`, msg);
    }
  }
  saveState(); render();
}

function submitIzinWaliMurid(e) {
  e.preventDefault();
  const nisn = document.getElementById('wm-nisn').value;
  const tanggal = document.getElementById('wm-tanggal').value;
  const jenis = document.getElementById('wm-jenis').value;
  const alasan = document.getElementById('wm-alasan').value.trim();
  const fileInput = document.getElementById('wm-file');
  const s = db.siswa.find(x => x.nisn === nisn);
  if (!s) return;

  const saveReq = (fileName, fileSizeKB, fileData) => {
    db.izinRequests.unshift({ id: 'IZN-' + Math.floor(100 + Math.random() * 900), tanggal, nisn: s.nisn, namaSiswa: s.nama, kelas: s.kelas, wali: s.wali, waWali: s.waWali, jenis, alasan, fileName, fileSizeKB, fileData, status: 'Menunggu' });
    const kls = db.kelasList.find(k => k.nama === s.kelas);
    if (kls) {
      const msgWK = formatTemplate(db.waConfig.tplWaliKelas, { nama_walikelas: kls.waliKelasNama, jenis_izin: jenis.toUpperCase(), nama_siswa: s.nama, kelas: s.kelas, tanggal, alasan });
      sendRealWhatsApp(kls.waWaliKelas, `${kls.waliKelasNama} (Wali Kelas ${s.kelas})`, msgWK);
    }
    saveState(); alert('Pengajuan terkirim & notifikasi WA dikirim ke Wali Kelas!'); render();
  };

  if (fileInput.files && fileInput.files[0]) {
    const file = fileInput.files[0];
    if (file.size > 1048576) return alert('Ukuran file maksimal 1 MB!');
    const reader = new FileReader();
    reader.onload = () => saveReq(file.name, Math.round(file.size / 1024), reader.result);
    reader.readAsDataURL(file);
  } else saveReq('Tanpa Lampiran', 0, '');
}

function handleVerifikasiIzin(id, disetujui) {
  const req = db.izinRequests.find(r => r.id === id);
  if (!req) return;
  req.status = disetujui ? 'Disetujui' : 'Ditolak';
  if (disetujui) setManualStatus(req.nisn, 'Siswa', req.namaSiswa, req.kelas, req.jenis);
  sendRealWhatsApp(req.waWali, `${req.wali} (Wali ${req.namaSiswa})`, `Assalamualaikum Wr. Wb. Yth. *${req.wali}*, pengajuan *${req.jenis}* untuk ananda *${req.namaSiswa}* (${req.kelas}) tanggal ${req.tanggal} telah *${req.status.toUpperCase()}*.`);
  saveState(); render();
}

function exportCSV() {
  const rows = [['Tanggal', 'Kode_ID', 'Nama', 'Kategori', 'Kelas_Unit', 'Jam_Masuk', 'Jam_Pulang', 'Status']];
  db.absensi.forEach(a => rows.push([a.tanggal, a.kode, `"${a.nama}"`, a.tipe, `"${a.kelasUnit}"`, a.jamMasuk || '-', a.jamPulang || '-', a.status]));
  const blob = new Blob([rows.map(r => r.join(',')).join('\n')], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `Rekap_Absensi_${db.school.shortCode}_${getTodayStr()}.csv`; link.click();
}

function backupJSON() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `Backup_${db.school.shortCode}_${getTodayStr()}.json`; link.click();
}

function restoreJSON(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { try { const p = JSON.parse(reader.result); if (p.school && p.siswa) { db = p; saveState(); alert('Dipulihkan!'); render(); } } catch (e) { alert('File tidak valid'); } };
  reader.readAsText(file);
}

        <div class="p-4 rounded-2xl border border-slate-200 bg-slate-50 space-y-2">
          <div class="flex justify-between">
            <div><p class="font-extrabold text-sm">${r.namaSiswa} (${r.kelas}) • ${r.jenis}</p><p class="text-xs text-slate-500">${r.tanggal} • Wali: ${r.wali}</p></div>
            <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800">${r.status}</span>
          </div>
          <p class="text-xs bg-white p-2.5 rounded-xl border">"${r.alasan}"</p>
          <div class="flex justify-between items-center text-xs">
            <span>📎 ${r.fileName} (${r.fileSizeKB} KB) ${r.fileData ? `<a href="${r.fileData}" download="${r.fileName}" class="ml-2 text-emerald-700 font-bold underline">Unduh</a>` : ''}</span>
            ${r.status === 'Menunggu' ? `<div class="flex gap-2"><button onclick="handleVerifikasiIzin('${r.id}', true)" class="px-3 py-1.5 bg-emerald-700 text-white font-bold rounded-xl">Setujui & WA</button><button onclick="handleVerifikasiIzin('${r.id}', false)" class="px-3 py-1.5 bg-rose-600 text-white font-bold rounded-xl">Tolak</button></div>` : ''}
          </div>
        </div>
      `).join('')}
    </div>
  </div>`;
}

function renderPortalWaliMurid() {
  const s = db.siswa[0];
  const kls = db.kelasList.find(k => k.nama === s.kelas);
  return `
  <div class="bg-white p-5 rounded-2xl border border-slate-200 space-y-4">
    <h2 class="text-lg font-extrabold">Portal Wali Murid & Upload Surat Izin (Maks. 1 MB)</h2>
    ${kls ? `<div class="p-3.5 rounded-2xl bg-emerald-50 border border-emerald-200 flex justify-between items-center"><div><p class="text-xs font-bold text-emerald-800">Wali Kelas ${kls.nama}</p><p class="text-sm font-extrabold">${kls.waliKelasNama}</p></div><button onclick="openDirectWhatsApp('${kls.waWaliKelas}', 'Assalamualaikum ${kls.waliKelasNama}')" class="px-3 py-2 bg-emerald-700 text-white text-xs font-bold rounded-xl">💬 WA Wali Kelas</button></div>` : ''}
    <form onsubmit="submitIzinWaliMurid(event)" class="space-y-3">
      <select id="wm-nisn" class="w-full px-3 py-2.5 rounded-xl border text-xs font-bold">${db.siswa.map(x => `<option value="${x.nisn}">${x.nama} (${x.kelas})</option>`).join('')}</select>
      <div class="grid grid-cols-2 gap-2">
        <input id="wm-tanggal" type="date" value="${getTodayStr()}" required class="px-3 py-2 rounded-xl border text-xs" />
        <select id="wm-jenis" class="px-3 py-2 rounded-xl border text-xs font-bold"><option value="Sakit">Sakit</option><option value="Izin">Izin</option></select>
      </div>
      <textarea id="wm-alasan" rows="2" required placeholder="Alasan izin / sakit..." class="w-full px-3 py-2 rounded-xl border text-xs"></textarea>
      <input id="wm-file" type="file" accept=".jpg,.jpeg,.png,.pdf" class="w-full text-xs border rounded-xl p-2" />
      <button type="submit" class="w-full py-3 bg-emerald-700 text-white font-extrabold text-xs rounded-xl">Kirim Izin & Notifikasi WA ke Wali Kelas</button>
    </form>
  </div>`;
}

function renderLaporan() {
  const filtered = db.absensi.filter(a => !filterTanggal || a.tanggal === filterTanggal);
  return `
  <div class="bg-white p-5 rounded-2xl border border-slate-200 space-y-3">
    <div class="flex justify-between items-center">
      <h2 class="text-lg font-extrabold">Laporan Absensi</h2>
      <div class="flex gap-2">
        <button onclick="exportCSV()" class="px-3 py-2 bg-emerald-700 text-white text-xs font-bold rounded-xl">📥 CSV</button>
        <button onclick="window.print()" class="px-3 py-2 bg-slate-800 text-white text-xs font-bold rounded-xl">🖨️ Cetak</button>
      </div>
    </div>
    <input type="date" value="${filterTanggal}" onchange="filterTanggal=this.value; render();" class="px-3 py-2 rounded-xl border text-xs" />
    <div class="overflow-x-auto">
      <table class="w-full text-left text-xs">
        <thead><tr class="bg-slate-100"><th class="p-2.5">Tanggal</th><th class="p-2.5">Kode</th><th class="p-2.5">Nama</th><th class="p-2.5">Kelas/Unit</th><th class="p-2.5">Masuk</th><th class="p-2.5">Pulang</th><th class="p-2.5">Status</th></tr></thead>
        <tbody class="divide-y">${filtered.map(a => `<tr><td class="p-2.5">${a.tanggal}</td><td class="p-2.5 font-mono">${a.kode}</td><td class="p-2.5 font-bold">${a.nama}</td><td class="p-2.5">${a.kelasUnit}</td><td class="p-2.5">${a.jamMasuk}</td><td class="p-2.5">${a.jamPulang||'-'}</td><td class="p-2.5 font-bold">${a.status}</td></tr>`).join('')}</tbody>
      </table>
    </div>
  </div>`;
}

function renderKeamananPublikasi() {
  return `
  <div class="bg-white p-5 rounded-2xl border border-slate-200 space-y-3">
    <h2 class="text-lg font-extrabold">Identitas Madrasah & Backup Database</h2>
    <input id="sch-name" value="${db.school.name}" class="w-full px-3 py-2 rounded-xl border text-xs font-bold" />
    <input id="sch-pin" value="${db.school.kioskPin}" class="w-full px-3 py-2 rounded-xl border text-xs font-mono" />
    <div class="flex flex-wrap gap-2">
      <button onclick="db.school.name=document.getElementById('sch-name').value; db.school.kioskPin=document.getElementById('sch-pin').value; saveState(); alert('Tersimpan!'); render();" class="px-4 py-2 bg-emerald-700 text-white text-xs font-bold rounded-xl">Simpan</button>
      <button onclick="backupJSON()" class="px-4 py-2 bg-slate-800 text-white text-xs font-bold rounded-xl">💾 Backup JSON</button>
      <label class="px-4 py-2 bg-slate-100 text-xs font-bold rounded-xl cursor-pointer">📂 Restore JSON<input type="file" accept=".json" onchange="restoreJSON(event)" class="hidden" /></label>
    </div>
  </div>`;
}

function render() {
  const root = document.getElementById('app');
  if (!root) return;
  window.__appRendered = true;
  if (!currentUser) { root.innerHTML = renderLogin(); return; }

  const navItems = [
    { id: 'dashboard', label: 'Beranda', icon: '🏠', roles: ['admin', 'piket', 'walikelas', 'guru'] },
    { id: 'scan', label: 'Scan Kios', icon: '📷', roles: ['admin', 'piket', 'guru'] },
    { id: 'walikelas', label: 'Wali Kelas', icon: '📋', roles: ['admin', 'walikelas'] },
    { id: 'portal_wali', label: 'Wali Murid', icon: '👪', roles: ['admin', 'walimurid', 'walikelas'] },
    { id: 'master', label: 'Kartu Barcode', icon: '🪪', roles: ['admin'] },
    { id: 'wa', label: 'WA & Log', icon: '💬', roles: ['admin'] },
    { id: 'laporan', label: 'Laporan', icon: '📊', roles: ['admin', 'piket', 'walikelas', 'guru'] },
    { id: 'keamanan', label: 'Publikasi', icon: '🛡️', roles: ['admin'] }
  ].filter(i => i.roles.includes(currentUser.role));

  let content = '';
  if (kioskLocked) content = renderScanKios();
  else if (activeTab === 'dashboard') content = renderDashboard();
  else if (activeTab === 'scan') content = renderScanKios();
  else if (activeTab === 'walikelas') content = renderWaliKelas();
  else if (activeTab === 'portal_wali') content = renderPortalWaliMurid();
  else if (activeTab === 'master') content = renderMasterKartu();
  else if (activeTab === 'wa') content = renderWhatsAppGateway();
  else if (activeTab === 'laporan') content = renderLaporan();
  else if (activeTab === 'keamanan') content = renderKeamananPublikasi();

  root.innerHTML = `
  <div class="min-h-screen flex flex-col pb-20 md:pb-6">
    <header class="no-print sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 px-4 py-3">
      <div class="max-w-5xl mx-auto flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-emerald-800 text-white font-extrabold text-xs flex items-center justify-center shadow">${db.school.shortCode}</div>
          <div>
            <h1 class="text-sm font-extrabold text-slate-900">${db.school.name}</h1>
            <p class="text-[11px] text-slate-500">${isOnline ? '🟢 Online' : '🟠 Offline'} • ${currentUser.role.toUpperCase()}</p>
          </div>
        </div>
        <div class="flex items-center gap-1.5">
          <button onclick="installPWA()" class="px-3 py-1.5 bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-xl text-xs font-extrabold">📲 Instal</button>
          <button onclick="toggleKioskLock()" class="px-3 py-1.5 ${kioskLocked ? 'bg-rose-600 text-white' : 'bg-slate-100 text-slate-700'} rounded-xl text-xs font-bold">${kioskLocked ? '🔒 Terkunci' : '🔓 Kios'}</button>
          ${!kioskLocked ? `<button onclick="logout()" class="px-3 py-1.5 bg-rose-50 text-rose-700 rounded-xl text-xs font-bold">Keluar</button>` : ''}
        </div>
      </div>
      ${!kioskLocked ? `<nav class="hidden md:flex max-w-5xl mx-auto gap-1.5 mt-3 pt-2.5 border-t border-slate-100 overflow-x-auto">${navItems.map(n => `<button onclick="if(activeTab==='scan' && n.id!=='scan') stopRealBarcodeScanner(); activeTab='${n.id}'; render();" class="px-3.5 py-2 rounded-xl text-xs font-bold ${activeTab === n.id ? 'bg-emerald-800 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}">${n.icon} ${n.label}</button>`).join('')}</nav>` : ''}
    </header>
    <main class="flex-1 max-w-5xl w-full mx-auto p-4">${content}</main>
    ${!kioskLocked ? `<nav class="no-print md:hidden fixed bottom-0 inset-x-0 z-30 bg-white border-t border-slate-200 flex justify-around py-1.5 px-1 shadow-lg">${navItems.slice(0, 6).map(n => `<button onclick="if(activeTab==='scan' && n.id!=='scan') stopRealBarcodeScanner(); activeTab='${n.id}'; render();" class="flex flex-col items-center py-1 px-1.5 rounded-xl ${activeTab === n.id ? 'text-emerald-800 font-extrabold' : 'text-slate-400'}"><span class="text-base">${n.icon}</span><span class="text-[10px] mt-0.5">${n.label}</span></button>`).join('')}</nav>` : ''}
  </div>`;
}

render();
</script>
</body>
</html>
